# v2/docker-compose.dev.yml
# Standalone or override compose file dedicated to v2 development

services:
  questly-db:
    image: mongo:7.0
    container_name: questly-db-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      questly-dev-network:
        aliases:
          - mongo
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  questly-mongo-express:
    image: mongo-express:1.0.2
    container_name: questly-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: questly-db
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_URL: mongodb://questly-db:27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      questly-db:
        condition: service_healthy
    networks:
      - questly-dev-network

  questly-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: questly-server-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://questly-db:27017/questly
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      questly-db:
        condition: service_healthy
    networks:
      - questly-dev-network

  questly-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: questly-client-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://questly-server:5000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - questly-server
    networks:
      - questly-dev-network

volumes:
  mongo_dev_data:
    driver: local

networks:
  questly-dev-network:
    driver: bridge
